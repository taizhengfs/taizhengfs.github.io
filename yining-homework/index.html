<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#eef1f6">
<meta name="description" content="以宁的每日作业 · 晚托作战单，按天查看与打印">
<title>以宁的每日作业</title>
<style>
  :root{
    --bg:#eef1f6;
    --card:#fff;
    --ink:#1b2030;
    --ink-2:#3d4761;
    --muted:#6a7387;
    --line:#e2e8f2;
    --line-2:#d6e2fb;
    --accent:#2f6bd8;
    --accent-2:#1f4fa8;
    --soft:#f2f6ff;
    --amber:#b5762a;
    --amber-soft:#fff8e6;
    --radius:14px;
    --shadow:0 1px 2px rgba(20,30,60,.05), 0 6px 20px rgba(20,30,60,.07);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    font-size:14px; line-height:1.6; -webkit-font-smoothing:antialiased;
  }
  a{color:var(--accent);text-decoration:none}

  /* ── 顶栏 ── */
  header{
    position:sticky; top:0; z-index:20;
    background:rgba(255,255,255,.92);
    -webkit-backdrop-filter:saturate(180%) blur(12px);
    backdrop-filter:saturate(180%) blur(12px);
    border-bottom:1px solid var(--line);
    padding:10px 14px 0;
  }
  .hd{display:flex;align-items:center;gap:10px;max-width:1180px;margin:0 auto}
  .hd h1{
    font-size:16px;margin:0;font-weight:700;letter-spacing:-.01em;
    display:flex;align-items:center;gap:7px;white-space:nowrap;
  }
  .hd h1 .em{font-size:18px}
  .hd .sub{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hd .sp{flex:1}
  .btn{
    border:1px solid var(--line); background:#fff; color:var(--ink-2);
    border-radius:9px; padding:6px 11px; font-size:12.5px; font-weight:600;
    cursor:pointer; display:inline-flex; align-items:center; gap:5px;
    white-space:nowrap; transition:.15s; font-family:inherit;
  }
  .btn:hover{border-color:var(--line-2);background:var(--soft);color:var(--accent)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.primary:hover{background:var(--accent-2);color:#fff}
  .btn:disabled{opacity:.4;cursor:default}
  .btn svg{width:13px;height:13px}

  /* ── 日期条 ── */
  .strip{
    display:flex; gap:7px; overflow-x:auto; padding:9px 2px 10px;
    max-width:1180px; margin:0 auto; scrollbar-width:none;
  }
  .strip::-webkit-scrollbar{display:none}
  .chip{
    flex:0 0 auto; border:1px solid var(--line); background:#fff;
    border-radius:10px; padding:5px 10px 4px; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; gap:0;
    min-width:58px; transition:.15s; font-family:inherit; color:var(--ink-2);
  }
  .chip b{font-size:13px;font-weight:700;line-height:1.35;letter-spacing:-.02em}
  .chip span{font-size:10px;color:var(--muted);line-height:1.3}
  .chip:hover{border-color:var(--line-2);background:var(--soft)}
  .chip[aria-current="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
  .chip[aria-current="true"] span{color:rgba(255,255,255,.8)}
  .chip .dot{display:inline-block;width:4px;height:4px;border-radius:50%;background:var(--amber);margin-left:3px;vertical-align:middle}
  .chip[aria-current="true"] .dot{background:#ffd479}
  .hint{
    flex:0 0 auto; display:flex; align-items:center; padding:0 6px;
    font-size:11px; color:var(--muted); white-space:nowrap;
  }

  /* ── 主体 ── */
  main{max-width:1180px;margin:0 auto;padding:0 14px 26px;overflow-x:clip}
  .panel{max-width:100%}
  .panel{
    background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow);
    border:1px solid rgba(20,30,60,.04); overflow:hidden;
  }
  .bar{
    display:flex; align-items:center; gap:9px; flex-wrap:wrap;
    padding:9px 12px; border-bottom:1px solid var(--line); background:#fcfdff;
  }
  .bar .day{font-weight:700;font-size:13.5px;white-space:nowrap}
  .bar .meta{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:100px}
  .bar .acts{display:flex;gap:6px}
  .info{
    display:flex;gap:8px;flex-wrap:wrap;padding:9px 12px;
    border-bottom:1px solid var(--line); background:var(--soft);
  }
  .kv{
    display:inline-flex;align-items:center;gap:6px;
    background:#fff;border:1px solid var(--line-2);border-radius:8px;
    padding:4px 9px;font-size:12px;color:var(--ink-2);max-width:100%;
  }
  .kv b{font-weight:700;color:var(--accent-2)}
  .kv .lb{color:var(--muted);font-size:11px}
  iframe{
    display:block; width:100%; border:0; background:#fff;
    height:min(78vh, 1100px);
  }
  .empty{padding:56px 20px;text-align:center;color:var(--muted)}
  .empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:6px}
  .plan-card{
    margin-top:14px; display:flex; align-items:center; gap:12px;
    background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow);
    border:1px solid rgba(20,30,60,.04); padding:14px 16px;
  }
  .plan-card .ic{
    width:40px;height:40px;flex:0 0 auto;border-radius:11px;background:var(--soft);
    display:flex;align-items:center;justify-content:center;font-size:19px;
  }
  .plan-card h3{margin:0 0 2px;font-size:14px}
  .plan-card p{margin:0;font-size:12px;color:var(--muted)}
  .plan-card .go{margin-left:auto;font-size:12.5px;font-weight:600;white-space:nowrap}
  footer{
    max-width:1180px;margin:0 auto;padding:4px 14px 30px;
    font-size:11px;color:#98a1b3;text-align:center;
  }
  .toast{
    position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);
    background:rgba(27,32,48,.94);color:#fff;padding:9px 16px;border-radius:20px;
    font-size:12.5px;opacity:0;pointer-events:none;transition:.25s;z-index:60;
  }
  .toast.on{opacity:1;transform:translate(-50%,0)}

  @media (max-width:640px){
    .hd{gap:6px}
    .hd .sub{display:none}
    .hd h1{font-size:15px;min-width:0;overflow:hidden}
    .hd .btn{padding:6px 9px;font-size:12px}
    main{padding:0 10px 20px}
    /* 工具条重排成两行：上一行日期，下一行按钮均分整宽（5 个按钮挤一行会撑破屏幕） */
    .bar{flex-direction:column;align-items:stretch;gap:6px;padding:8px 10px}
    .bar .day{font-size:13px}
    .bar .meta{order:0;flex:0 0 auto;white-space:normal;min-width:0}
    .bar .acts{display:grid;grid-template-columns:auto auto 1fr 1fr 1fr;gap:6px;margin-left:0}
    .bar .acts .btn{justify-content:center;padding:7px 6px;min-width:0;overflow:hidden;text-overflow:ellipsis}
    /* 元信息一行横滑，别占三行高度 */
    .info{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
    .info::-webkit-scrollbar{display:none}
    .kv{flex:0 0 auto}
    iframe{height:calc(100vh - 268px);min-height:360px}
  }
  @media print{
    header,.strip,.bar,.info,.plan-card,footer{display:none!important}
    body{background:#fff}
    .panel{box-shadow:none;border:0}
    iframe{height:auto;min-height:100vh}
  }
</style>
</head>
<body>

<header>
  <div class="hd">
    <h1><span class="em">🗓️</span>以宁的每日作业</h1>
    <div class="sub" id="stamp"></div>
    <div class="sp"></div>
    <a class="btn" href="https://taizhendong.com/yining-literacy/" target="_blank" rel="noopener">📖 认字簿</a>
    <a class="btn" href="./plan.html" target="_blank" rel="noopener">📋 计划</a>
  </div>
  <div class="strip" id="strip"></div>
</header>

<main>
  <div class="panel">
    <div class="bar">
      <div class="day" id="dayLabel">—</div>
      <div class="meta" id="dayMeta"></div>
      <div class="acts">
        <button class="btn" id="prev" title="前一天">‹</button>
        <button class="btn" id="next" title="后一天">›</button>
        <button class="btn" id="copy" title="复制纯文本，可直接粘到微信">复制</button>
        <button class="btn" id="open" title="在新窗口打开">新窗口</button>
        <button class="btn primary" id="print">打印</button>
      </div>
    </div>
    <div class="info" id="info"></div>
    <iframe id="frame" title="作业单" src="about:blank"></iframe>
    <div class="empty" id="empty" style="display:none">
      <b>还没有发布过作业单</b>
      每天 15:00 自动生成，生成后这里就会出现。
    </div>
  </div>

  <a class="plan-card" href="./plan.html" target="_blank" rel="noopener">
    <div class="ic">📋</div>
    <div>
      <h3>以宁学业作战计划（2026.10 起）</h3>
      <p>杭州升学规则 · 一到六年级里程碑 · 晚托 120 分钟时间盒 · 动机工程 · 家长操作日历</p>
    </div>
    <div class="go">查看 →</div>
  </a>
</main>

<footer>作业单由本地脚本每天自动生成并发布 · 答案在打印版第二页</footer>
<div class="toast" id="toast"></div>

<script>
(function () {
  var days = [], cur = -1;
  var $strip = document.getElementById('strip');
  var $frame = document.getElementById('frame');
  var $info  = document.getElementById('info');
  var $label = document.getElementById('dayLabel');
  var $meta  = document.getElementById('dayMeta');
  var $empty = document.getElementById('empty');
  var $stamp = document.getElementById('stamp');

  function toast(msg) {
    var t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('on');
    clearTimeout(t._h); t._h = setTimeout(function () { t.classList.remove('on'); }, 1800);
  }

  function today() {
    var d = new Date(), p = function (n) { return n < 10 ? '0' + n : '' + n; };
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
  }

  function shortDate(s) { var a = s.split('-'); return a[1].replace(/^0/, '') + '/' + a[2].replace(/^0/, ''); }

  function renderChips() {
    $strip.innerHTML = '';
    days.forEach(function (d, i) {
      var b = document.createElement('button');
      b.className = 'chip';
      b.setAttribute('aria-current', i === cur ? 'true' : 'false');
      var review = (d.charsReview || []).length;
      b.innerHTML = '<b>' + shortDate(d.date) + '</b><span>周' + (d.weekday || '') +
        (review ? '<i class="dot"></i>' : '') + '</span>';
      b.onclick = function () { select(i, true); };
      $strip.appendChild(b);
    });
    if (days.length < 3) {
      var h = document.createElement('div');
      h.className = 'hint';
      h.textContent = '每天 15:00 自动生成，历史会一天天攒起来';
      $strip.appendChild(h);
    }
  }

  function select(i, scroll) {
    if (i < 0 || i >= days.length) return;
    cur = i;
    var d = days[i];
    $empty.style.display = 'none';
    $frame.style.display = 'block';
    $frame.src = d.html;
    $label.textContent = d.date + '（周' + (d.weekday || '') + '）';
    $meta.textContent = (d.grade || '') + ' · ' + (d.term || '') + ' · ' +
      (d.school ? '在校日 #' + d.schoolDay : '假期 / 周末版');

    var bits = [];
    if (d.cnUnit)   bits.push('<span class="kv"><span class="lb">语文</span><b>' + d.cnUnit + '</b></span>');
    if (d.mathUnit) bits.push('<span class="kv"><span class="lb">数学</span><b>' + d.mathUnit + '</b></span>');
    var cn = (d.charsReview || []).concat(d.charsNew || []);
    if (cn.length)  bits.push('<span class="kv"><span class="lb">今日五字</span><b>' + cn.join('') + '</b></span>');
    if (d.charsTotal) bits.push('<span class="kv"><span class="lb">累计</span><b>' + d.charsTotal + '</b>字</span>');
    if (d.boss)     bits.push('<span class="kv"><span class="lb">Boss</span><b>' + d.boss + '</b></span>');
    $info.innerHTML = bits.join('');

    document.getElementById('prev').disabled = (i >= days.length - 1);
    document.getElementById('next').disabled = (i <= 0);
    renderChips();
    if (scroll) {
      var el = $strip.children[i];
      if (el && el.scrollIntoView) el.scrollIntoView({ block: 'nearest', inline: 'center', behavior: 'smooth' });
    }
    if (history.replaceState) history.replaceState(null, '', '#' + d.date);
  }

  document.getElementById('prev').onclick = function () { select(cur + 1, true); };
  document.getElementById('next').onclick = function () { select(cur - 1, true); };
  document.getElementById('open').onclick  = function () {
    if (days[cur]) window.open(days[cur].html, '_blank');
  };
  document.getElementById('print').onclick = function () {
    try { $frame.contentWindow.focus(); $frame.contentWindow.print(); }
    catch (e) { if (days[cur]) window.open(days[cur].html, '_blank'); }
  };
  document.getElementById('copy').onclick = function () {
    if (!days[cur]) return;
    fetch(days[cur].txt).then(function (r) { return r.text(); }).then(function (t) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(t).then(function () { toast('已复制，可直接粘贴到微信'); },
          function () { toast('复制失败，请用「新窗口」查看'); });
      } else {
        var ta = document.createElement('textarea');
        ta.value = t; document.body.appendChild(ta); ta.select();
        try { document.execCommand('copy'); toast('已复制'); } catch (e) { toast('复制失败'); }
        document.body.removeChild(ta);
      }
    });
  };
  document.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowLeft') select(cur + 1, true);
    if (e.key === 'ArrowRight') select(cur - 1, true);
  });

  fetch('./index.json?t=' + Date.now())
    .then(function (r) { return r.json(); })
    .then(function (data) {
      days = data.days || [];
      if (!days.length) {
        $empty.style.display = 'block';
        $frame.style.display = 'none';
        return;
      }
      $stamp.textContent = '共 ' + days.length + ' 天 · 更新于 ' + (data.updatedAt || '');
      var want = location.hash.replace('#', '');
      var idx = 0;
      for (var i = 0; i < days.length; i++) { if (days[i].date === want) { idx = i; break; } }
      select(idx, true);
      var latest = days[0].date;
      if (latest !== today()) {
        $stamp.textContent += ' · 今日作业尚未生成';
      }
    })
    .catch(function () {
      $empty.style.display = 'block';
      $frame.style.display = 'none';
      $empty.innerHTML = '<b>作业索引读取失败</b>请稍后刷新，或检查 index.json 是否已发布。';
    });
})();
</script>
</body>
</html>
