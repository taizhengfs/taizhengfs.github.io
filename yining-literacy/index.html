<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#FAF6EE">
<meta name="description" content="以宁的认字簿 · 统编版一二年级识字表，每天五个字">
<title>以宁的认字簿 - Warden's Life</title>
<style>
:root{
  --paper:#FAF6EE;
  --paper-2:#F3EDE1;
  --card:#FFFFFF;
  --ink:#241F1A;
  --ink-2:#5C5348;
  --muted:#9A9083;
  --line:rgba(36,31,26,.10);
  --line-2:rgba(36,31,26,.16);
  --grid:#E3C9BE;
  --grid-2:#F0DED6;
  --red:#C1443B;
  --red-soft:#FBEDEB;
  --green:#3F6F63;
  --green-soft:#EAF2EF;
  --amber:#C8892F;
  --amber-soft:#FBF2E2;
  --shadow:0 1px 2px rgba(36,31,26,.04),0 8px 24px rgba(36,31,26,.06);
  --shadow-lg:0 2px 6px rgba(36,31,26,.06),0 18px 48px rgba(36,31,26,.12);
  --r:16px;
  --kai:"Kaiti SC","STKaiti","KaiTi","楷体","Songti SC","STSong",serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  font-size:15px;line-height:1.6;
  -webkit-font-smoothing:antialiased;
  padding-bottom:env(safe-area-inset-bottom);
}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer;border:0;background:none}
.wrap{max-width:880px;margin:0 auto;padding:0 18px 72px}

/* ---------- 头部 ---------- */
.hd{padding:26px 0 14px;display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.hd h1{margin:0;font-size:26px;letter-spacing:.06em;font-weight:600}
.hd .sub{margin:4px 0 0;font-size:12.5px;color:var(--muted);letter-spacing:.04em}
.seal{
  flex:none;width:46px;height:46px;border-radius:12px;background:var(--red);
  color:#fff;display:flex;align-items:center;justify-content:center;
  font-family:var(--kai);font-size:24px;letter-spacing:0;
  box-shadow:0 4px 12px rgba(193,68,59,.28);
}
.sync{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);margin-top:8px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--muted);flex:none}
.dot.on{background:var(--green)}.dot.busy{background:var(--amber);animation:pulse 1s infinite}
.dot.off{background:#C9C2B6}
@keyframes pulse{50%{opacity:.35}}

/* ---------- Tab ---------- */
.tabs{
  display:grid;grid-template-columns:repeat(5,1fr);gap:4px;background:var(--paper-2);
  padding:4px;border-radius:14px;margin:8px 0 20px;position:sticky;top:8px;z-index:30;
  box-shadow:0 1px 0 rgba(36,31,26,.04);
}
.tab{
  padding:9px 4px;border-radius:11px;font-size:13.5px;color:var(--ink-2);
  text-align:center;transition:all .18s;font-weight:500;
}
.tab[aria-selected="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(36,31,26,.10)}
.tab .tnum{display:block;font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.tab[aria-selected="true"] .tnum{color:var(--red)}

/* ---------- 卡片 ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:18px;margin-bottom:16px}
.card.tight{padding:14px 16px}
.ttl{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:0 0 12px}
.ttl h2{margin:0;font-size:15px;font-weight:600;letter-spacing:.02em}
.ttl .hint{font-size:12px;color:var(--muted)}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}

/* ---------- 田字格 ---------- */
.tz{
  position:relative;background:#fff;border:2px solid var(--grid);border-radius:8px;
  aspect-ratio:1;width:100%;display:flex;align-items:center;justify-content:center;overflow:hidden;
}
.tz.lg{border-radius:12px;border-width:2.5px}
.tz::before,.tz::after{content:'';position:absolute;inset:0;pointer-events:none}
.tz::before{
  background:
    linear-gradient(to right,transparent calc(50% - .5px),var(--grid-2) calc(50% - .5px),var(--grid-2) calc(50% + .5px),transparent calc(50% + .5px)),
    linear-gradient(to bottom,transparent calc(50% - .5px),var(--grid-2) calc(50% - .5px),var(--grid-2) calc(50% + .5px),transparent calc(50% + .5px));
}
.tz::after{
  background:
    linear-gradient(45deg,transparent calc(50% - .4px),var(--grid-2) calc(50% - .4px),var(--grid-2) calc(50% + .4px),transparent calc(50% + .4px)),
    linear-gradient(-45deg,transparent calc(50% - .4px),var(--grid-2) calc(50% - .4px),var(--grid-2) calc(50% + .4px),transparent calc(50% + .4px));
  opacity:.75;
}
.hz{font-family:var(--kai);font-weight:400;line-height:1;position:relative;z-index:1;user-select:none}

/* ---------- 今日 ---------- */
.daybar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.daybar .d{font-size:19px;font-weight:600;letter-spacing:.02em}
.daybar .d small{font-size:12px;color:var(--muted);font-weight:400;margin-left:8px}
.teacher{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.chip{
  padding:6px 13px;border-radius:20px;border:1px solid var(--line-2);background:#fff;
  font-size:13px;color:var(--ink-2);transition:all .16s;
}
.chip[aria-pressed="true"]{background:var(--red);border-color:var(--red);color:#fff}
.chip.ghost{border-style:dashed;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
@media(max-width:560px){.tiles{grid-template-columns:repeat(2,1fr);gap:12px}}
.tile{text-align:center}
.tile .py{
  font-size:12px;color:var(--red);letter-spacing:.04em;height:19px;line-height:19px;
  margin-bottom:5px;font-family:"PingFang SC",sans-serif;
}
.tile .py.hide{visibility:hidden}
.tile .tz .hz{font-size:min(13vw,58px)}
@media(max-width:560px){.tile .tz .hz{font-size:min(22vw,86px)}}
.tile .w{margin-top:9px;font-size:11.5px;color:var(--ink-2);min-height:32px;line-height:1.45}
.tile .w span{display:inline-block;padding:1px 6px;background:var(--paper-2);border-radius:5px;margin:1px}
.tile .acts{display:flex;gap:6px;margin-top:8px;justify-content:center}
.tile .acts button{
  flex:1;padding:6px 4px;border-radius:9px;font-size:12px;border:1px solid var(--line-2);
  background:#fff;color:var(--ink-2);transition:all .16s;
}
.tile .acts button:active{transform:scale(.96)}
.tile .acts .ok:hover{border-color:var(--green);color:var(--green);background:var(--green-soft)}
.tile.done .tz{border-color:var(--green);background:var(--green-soft)}
.tzwrap{position:relative}
/* 阶段提示条 */
.phase{
  border-radius:12px;padding:11px 14px;margin-bottom:14px;line-height:1.5;
  border:1px solid var(--line-2);background:var(--paper-2);
}
.phase b{display:block;font-size:14.5px;letter-spacing:.02em}
.phase span{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.phase.sift{border-color:#D9C9A8;background:#FBF4E4}
.phase.sift b{color:#8A6A22}
.phase.learn{border-left:3px solid var(--red);background:#FBF1F0}
.phase.learn b{color:var(--red)}
/* 印章：认（本来就认识）/ 学（今天要学）/ 会（学会了） */
.tile .stamp{
  position:absolute;right:-4px;bottom:-4px;z-index:2;width:26px;height:26px;border-radius:50%;
  background:var(--red);color:#fff;font-family:var(--kai);font-size:13px;
  display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(193,68,59,.3);
}
.tile .stamp.s2{background:var(--amber);box-shadow:0 2px 6px rgba(176,125,31,.3)}
.tile .stamp.s3{background:var(--green);box-shadow:0 2px 6px rgba(79,122,84,.3)}
.tile.picked .tz{border-color:var(--amber);background:var(--amber-soft)}
.tile.picked .acts .undo{flex:1}
.tile .acts .undo{
  border-color:var(--line-2);color:var(--muted);flex:1;
}
.tile .acts .undo:hover{border-color:var(--ink-2);color:var(--ink-2)}
.tile .acts .no{
  flex:1;padding:6px 4px;border-radius:9px;font-size:12px;border:1px solid var(--line-2);
  background:#fff;color:var(--ink-2);transition:all .16s;
}
.tile .acts .no:hover{border-color:var(--amber);color:var(--amber);background:var(--amber-soft)}
.tile .acts .no:active{transform:scale(.96)}
/* 集齐 5 个字时的庆祝：卡片依次跳一下 */
.tiles.cheer .tile{animation:cheer .5s cubic-bezier(.25,1.4,.4,1) both}
.tiles.cheer .tile:nth-child(2){animation-delay:.06s}
.tiles.cheer .tile:nth-child(3){animation-delay:.12s}
.tiles.cheer .tile:nth-child(4){animation-delay:.18s}
.tiles.cheer .tile:nth-child(5){animation-delay:.24s}
@keyframes cheer{
  0%{transform:translateY(0)}
  35%{transform:translateY(-9px) scale(1.04)}
  100%{transform:translateY(0)}
}
@media(prefers-reduced-motion:reduce){
  .tiles.cheer .tile{animation-duration:.01s}
}
/* 换卡：旧字盖上印章后翻走，新字浮现 */
.tile{will-change:transform,opacity}
.tile.swap-out{animation:swapOut .24s cubic-bezier(.36,0,.66,-.2) forwards;pointer-events:none}
.tile.swap-in{animation:swapIn .36s cubic-bezier(.21,.9,.3,1) both}
.tile.swap-out .stamp{animation:stampIn .2s cubic-bezier(.2,1.5,.4,1) both}
.tile.swap-in .stamp{animation:stampIn .3s cubic-bezier(.2,1.4,.4,1) .12s both}
@keyframes swapOut{
  0%{opacity:1;transform:none}
  100%{opacity:0;transform:translateY(-12px) scale(.9)}
}
@keyframes swapIn{
  0%{opacity:0;transform:translateY(16px) scale(.93)}
  100%{opacity:1;transform:none}
}
@keyframes stampIn{
  0%{opacity:0;transform:scale(2.2) rotate(-24deg)}
  60%{opacity:1;transform:scale(.92) rotate(6deg)}
  100%{opacity:1;transform:scale(1) rotate(0)}
}
@media(prefers-reduced-motion:reduce){
  .tile.swap-out,.tile.swap-in,.tile.swap-out .stamp,.tile.swap-in .stamp{animation-duration:.01s}
}
.empty{text-align:center;padding:26px 10px;color:var(--muted);font-size:13.5px}

/* ---------- 按钮 ---------- */
.btn{
  padding:9px 16px;border-radius:11px;background:var(--ink);color:#fff;font-size:13.5px;
  transition:all .16s;border:1px solid var(--ink);font-weight:500;
}
.btn:hover{opacity:.88}
.btn.ghost{background:#fff;color:var(--ink-2);border-color:var(--line-2)}
.btn.ghost:hover{background:var(--paper-2)}
.btn.red{background:var(--red);border-color:var(--red)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.sm{padding:6px 12px;font-size:12.5px;border-radius:9px}

/* ---------- 抽查 ---------- */
.quiz{text-align:center;padding:8px 0 4px}
.quiz .qwrap{max-width:270px;margin:0 auto}
.quiz .tz .hz{font-size:min(30vw,150px)}
.quiz .meta{margin-top:14px;min-height:56px}
.quiz .py{font-size:22px;color:var(--red);letter-spacing:.06em;font-weight:500}
.quiz .ws{margin-top:6px;font-size:14px;color:var(--ink-2)}
.quiz .ws span{display:inline-block;margin:0 3px;padding:2px 9px;background:var(--paper-2);border-radius:6px}
.qbtns{display:flex;gap:10px;max-width:340px;margin:16px auto 0}
.qbtns button{flex:1;padding:14px 0;border-radius:13px;font-size:15px;font-weight:500;border:1px solid var(--line-2);background:#fff;transition:all .18s}
.qbtns .yes:hover{border-color:var(--green);background:var(--green-soft);color:var(--green)}
.qbtns .no:hover{border-color:var(--red);background:var(--red-soft);color:var(--red)}
.qstat{display:flex;justify-content:center;gap:22px;margin-top:18px;font-size:12.5px;color:var(--muted)}
.qstat b{display:block;font-size:19px;color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}

/* ---------- 字库 ---------- */
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.filters .chip{padding:5px 11px;font-size:12.5px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(58px,1fr));gap:8px}
.cell{
  position:relative;aspect-ratio:1;border-radius:8px;border:1px solid var(--grid);background:#fff;
  display:flex;align-items:center;justify-content:center;font-family:var(--kai);font-size:26px;
  transition:all .14s;color:var(--ink);
}
.cell:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.cell.k{border-color:var(--green);background:var(--green-soft);color:var(--green)}
.cell.f{border-color:var(--amber);background:var(--amber-soft);color:var(--amber)}
.cell.n{color:var(--muted);border-color:var(--line);background:#FCFAF6}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin-top:12px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* ---------- 记录 ---------- */
.log{border-left:2px solid var(--line);padding-left:16px;margin-left:6px}
.log .e{position:relative;padding-bottom:20px}
.log .e::before{
  content:'';position:absolute;left:-22px;top:6px;width:10px;height:10px;border-radius:50%;
  background:var(--red);box-shadow:0 0 0 3px var(--paper);
}
.log .ed{font-size:13.5px;font-weight:600}
.log .et{font-size:12px;color:var(--muted);margin-top:1px}
.log .ec{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.log .ec b{
  font-family:var(--kai);font-weight:400;font-size:20px;width:34px;height:34px;border-radius:7px;
  border:1px solid var(--grid);background:#fff;display:flex;align-items:center;justify-content:center;
}
.log .ec b.k{border-color:var(--green);background:var(--green-soft);color:var(--green)}
.log .ec b.f{border-color:var(--amber);background:var(--amber-soft);color:var(--amber)}
.log .ec .sep{
  align-self:center;font-size:11px;color:var(--muted);margin-left:6px;
  padding-right:8px;border-right:1px dashed var(--line-2);
}

/* ---------- 统计 ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:10px}
.kpi{background:var(--paper-2);border-radius:12px;padding:12px 10px;text-align:center}
.kpi b{display:block;font-size:24px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.2}
.kpi span{font-size:11.5px;color:var(--muted)}
.bar{margin:10px 0 0}
.bar .l{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:5px}
.bar .t{height:7px;border-radius:4px;background:var(--paper-2);overflow:hidden}
.bar .t i{display:block;height:100%;background:var(--green);border-radius:4px;transition:width .5s}
.bar .t i.g2{background:var(--amber)}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.setrow:last-child{border-bottom:0}
.setrow label{font-size:13.5px;color:var(--ink-2)}
.setrow input,.setrow select{
  padding:6px 10px;border:1px solid var(--line-2);border-radius:9px;background:#fff;
  font-size:13.5px;max-width:170px;font-family:inherit;color:var(--ink);
}

/* ---------- 详情弹层 ---------- */
.mask{
  position:fixed;inset:0;background:rgba(36,31,26,.42);z-index:60;display:none;
  align-items:flex-end;justify-content:center;backdrop-filter:blur(3px);
}
.mask.on{display:flex}
.sheet{
  width:100%;max-width:460px;background:var(--card);border-radius:22px 22px 0 0;
  padding:22px 20px calc(26px + env(safe-area-inset-bottom));animation:up .26s cubic-bezier(.2,.9,.3,1);
  max-height:88vh;overflow:auto;
}
@keyframes up{from{transform:translateY(28px);opacity:.5}}
.sheet .cls{position:absolute;right:16px;top:14px;font-size:22px;color:var(--muted);line-height:1}
.dtl{text-align:center;position:relative}
.dtl .big{width:180px;margin:6px auto 0}
.dtl .big .hz{font-size:118px}
.dtl .dpy{font-size:20px;color:var(--red);letter-spacing:.08em;margin-bottom:2px}
.dtl .dws{margin:14px 0 0}
.dtl .dws span{display:inline-block;padding:4px 11px;background:var(--paper-2);border-radius:8px;margin:3px;font-size:14px}
.dtl .dmeta{margin-top:12px;font-size:12px;color:var(--muted)}
.dact{display:flex;gap:8px;margin-top:16px;justify-content:center;flex-wrap:wrap}
#hw{width:180px;height:180px;margin:10px auto 0}
#hw svg{width:100%;height:100%}

/* ---------- toast ---------- */
.toast{
  position:fixed;left:50%;bottom:34px;transform:translateX(-50%) translateY(14px);
  background:var(--ink);color:#fff;padding:10px 18px;border-radius:11px;font-size:13.5px;
  opacity:0;pointer-events:none;transition:all .24s;z-index:80;box-shadow:var(--shadow-lg);
  max-width:86vw;text-align:center;
}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.foot{text-align:center;font-size:11.5px;color:var(--muted);padding:14px 0 0;line-height:1.7}
</style>
</head>
<body>
<div class="wrap">

  <div class="hd">
    <div>
      <h1>以宁的认字簿</h1>
      <p class="sub">统编版一二年级识字表 · 每天五个字</p>
      <div class="sync"><span class="dot" id="dot"></span><span id="synctxt">正在连接…</span></div>
    </div>
    <div class="seal">宁</div>
  </div>

  <div class="tabs" role="tablist">
    <button class="tab" role="tab" data-tab="today" aria-selected="true">今日<span class="tnum" id="n-today">0/5</span></button>
    <button class="tab" role="tab" data-tab="quiz" aria-selected="false">抽查<span class="tnum" id="n-quiz">0</span></button>
    <button class="tab" role="tab" data-tab="lib" aria-selected="false">字库<span class="tnum" id="n-lib">0</span></button>
    <button class="tab" role="tab" data-tab="log" aria-selected="false">记录<span class="tnum" id="n-log">0</span></button>
    <button class="tab" role="tab" data-tab="stat" aria-selected="false">统计<span class="tnum" id="n-stat">0%</span></button>
  </div>

  <!-- 今日 -->
  <section id="p-today">
    <div class="card">
      <div class="daybar">
        <div class="d" id="d-date">—</div>
        <button class="btn ghost sm" id="t-reopen" hidden>重新挑一遍</button>
      </div>
      <div class="phase" id="t-phase" hidden></div>
      <div class="ttl"><h2>今天谁教</h2><span class="hint">点一下就能改</span></div>
      <div class="teacher" id="teachers"></div>
      <div class="ttl" style="margin:18px 0 12px"><h2>今天的字</h2><span class="hint" id="d-prog"></span></div>
      <div class="tiles" id="tiles"></div>
      <div class="empty" id="t-empty" style="display:none">字库已经全部学完了，了不起。</div>
    </div>
  </section>

  <!-- 抽查 -->
  <section id="p-quiz" hidden>
    <div class="card">
      <div class="ttl"><h2>随机抽查</h2><span class="hint" id="q-scope-txt"></span></div>
      <div class="filters" id="q-scope"></div>
      <div class="quiz" id="q-body"></div>
      <div class="qstat">
        <div><b id="q-cur">0</b>本轮</div>
        <div><b id="q-right">0</b>答对</div>
        <div><b id="q-rate">—</b>历史正确率</div>
      </div>
    </div>
  </section>

  <!-- 字库 -->
  <section id="p-lib" hidden>
    <div class="card">
      <div class="ttl"><h2>字库</h2><span class="hint" id="lib-sum"></span></div>
      <div class="filters" id="lib-status"></div>
      <div class="filters" id="lib-grade"></div>
      <div class="grid" id="lib-grid"></div>
      <div class="legend">
        <span><i style="background:var(--green)"></i>已掌握</span>
        <span><i style="background:var(--amber)"></i>需巩固</span>
        <span><i style="background:var(--line)"></i>还没学</span>
        <span style="margin-left:auto">点一个字看详情</span>
      </div>
    </div>
  </section>

  <!-- 记录 -->
  <section id="p-log" hidden>
    <div class="card">
      <div class="ttl"><h2>学习记录</h2><span class="hint">按日期倒序</span></div>
      <div class="log" id="log-list"></div>
      <div class="empty" id="l-empty" style="display:none">还没有记录，今天先学五个字吧。</div>
    </div>
  </section>

  <!-- 统计 -->
  <section id="p-stat" hidden>

<script>
/* ============ 常量 ============ */
const API_BASE = 'https://time.taizhendong.com';
const DEFAULT_BIN = 'yining-renzibu-v1';
const LS_BIN = 'yining_renzibu_bin';
const LS_DATA = 'yining_renzibu_data_';
const LS_DEV  = 'yining_renzibu_device';
const LS_SNAP = 'yining_renzibu_snap_';
const SNAP_MAX = 5;
const DEF_TEACHERS = ['妈妈','爸爸','奶奶','爷爷','老师'];

/* ============ 状态 ============ */
let POOL = [];          // [{c,p,w,g,gi}]
let MAP = {};           // char -> item
let GRADES = [];
let DB = null;          // 云端/本地数据
let binId = null;
let syncing = false, pending = false, timer = null;
let hwReady = false;
let DEVICE_ID = '';
try{
  DEVICE_ID = localStorage.getItem(LS_DEV);
  if(!DEVICE_ID){
    DEVICE_ID = 'd' + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
    localStorage.setItem(LS_DEV, DEVICE_ID);
  }
}catch(e){ DEVICE_ID = 'd' + Date.now().toString(36); }
let libFilter = { status:'all', grade:'all' };
let qScope = 'learned';
let quiz = { list:[], i:0, right:0, total:0, revealed:false, cur:null };

const $ = s => document.querySelector(s);
const todayKey = () => fmtDate(new Date());
function fmtDate(d){
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function weekday(d){ return '日一二三四五六'[d.getDay()]; }

/* ============ 数据骨架 ============ */
/* 每天分两阶段：
   sift  筛选：给以宁看一批字，认识的换掉、不认识的留下，直到凑够 5 个
   learn 学习：这 5 个字锁定为「今天要学的字」，不再更换 */
function blankDay(){
  return { teacher:'', phase:'sift', pool:[], sifted:[], picked:[], history:[],
           at:new Date().toISOString() };
}
function blankDB(){
  return { version:3, child:'以宁', perDay:5, teachers:DEF_TEACHERS.slice(),
           days:{}, learned:{}, quiz:{}, createdAt:new Date().toISOString(), rev:0 };
}
/* quiz 由裸计数 {right,total} 改为 「日期 → 设备 → [对,总]」。
   同一台设备同一天取最大值（重复上传不会翻倍），不同设备相加（各答各的）。 */
function quizTotals(q){
  let right = 0, total = 0;
  for(const day of Object.keys(q || {})){
    const per = q[day];
    if(!per || typeof per !== 'object') continue;
    const vals = Array.isArray(per) ? [per] : Object.values(per);
    vals.forEach(v => { if(Array.isArray(v)){ right += (+v[0]||0); total += (+v[1]||0); } });
  }
  return { right, total };
}
function bumpQuiz(isRight){
  const k = todayKey();
  if(!DB.quiz || Array.isArray(DB.quiz) || typeof DB.quiz !== 'object') DB.quiz = {};
  if(!DB.quiz[k] || Array.isArray(DB.quiz[k])) DB.quiz[k] = {};
  const v = DB.quiz[k][DEVICE_ID] || [0,0];
  v[1]++; if(isRight) v[0]++;
  DB.quiz[k][DEVICE_ID] = v;
}
function cloneJSON(v){ try{ return JSON.parse(JSON.stringify(v)); }catch(e){ return {}; } }
function migrateQuiz(q){
  const out = {};
  if(!q || typeof q !== 'object' || Array.isArray(q)) return out;
  if(typeof q.total === 'number'){                       // v1：{right,total}
    if(q.total) out['1970-01-01'] = { legacy:[+q.right||0, +q.total||0] };
    return out;
  }
  for(const day of Object.keys(q)){
    const v = q[day];
    if(!v || typeof v !== 'object') continue;
    out[day] = Array.isArray(v) ? { legacy:[+v[0]||0, +v[1]||0] } : v;
  }
  return out;
}
function normalize(d){
  const b = blankDB();
  if(!d || typeof d!=='object') return b;
  const o = Object.assign(b, d);
  o.version = 3;
  // 深拷贝：normalize 的结果会被 mergeDB 就地改写，共享引用会污染入参
  o.days = (d.days && typeof d.days==='object') ? cloneJSON(d.days) : {};
  for(const dk of Object.keys(o.days)){
    const dd = o.days[dk];
    if(!dd || typeof dd !== 'object'){ delete o.days[dk]; continue; }
    const base = blankDay();
    if(Array.isArray(dd.pool) || Array.isArray(dd.picked)){ Object.assign(base, dd); o.days[dk] = base; continue; }
    const chars = Array.isArray(dd.chars) ? dd.chars : [];
    base.teacher = dd.teacher || '';
    base.picked  = chars.slice();
    base.sifted  = chars.slice();
    base.pool    = [];
    base.history = Array.isArray(dd.history) ? dd.history.slice() : chars.slice();
    base.phase   = 'learn';
    base.at      = dd.at || base.at;
    o.days[dk]   = base;
  }
  o.learned = (d.learned && typeof d.learned==='object') ? cloneJSON(d.learned) : {};
  // v3 起每天分「筛选 / 学习」两阶段，与 v2 的单卡片模型不兼容，
  // 且旧数据口径（本来就认识 vs 当天学会）无法还原。
  // 旧记录整体作废，翻开干净的一页 —— 这样连旧缓存也会被自动丢弃。
  // 必须放在 days/learned 赋值之后，否则清了又被填回来。
  if((parseInt(d.version, 10) || 0) < 3){ o.days = {}; o.learned = {}; }
  // 旧结构迁移：裸计数 / 扁平按天数组 都归到 legacy 名下，总量不丢
  o.quiz = migrateQuiz(d && d.quiz);
  // 老数据里按天记的 [right,total] 也归到 legacy
  for(const day of Object.keys(o.quiz)){
    if(Array.isArray(o.quiz[day])) o.quiz[day] = { legacy: o.quiz[day] };
  }
  if(!Array.isArray(o.teachers) || !o.teachers.length) o.teachers = DEF_TEACHERS.slice();
  o.perDay = Math.min(20, Math.max(1, parseInt(o.perDay,10)||5));
  o.rev = parseInt(o.rev, 10) || 0;
  if(!o.createdAt) o.createdAt = new Date().toISOString();
  // 清理字库里已不存在的字（字库加载完成后才做，缺字库时不误删）
  if(MAP && Object.keys(MAP).length){
    const inPool = c => MAP[c];
    for(const k of Object.keys(o.learned)) if(!MAP[k]) delete o.learned[k];
    for(const dk of Object.keys(o.days)){
      const dd = o.days[dk];
      ['pool','sifted','picked','history'].forEach(f => {
        if(Array.isArray(dd[f])) dd[f] = dd[f].filter(inPool);
      });
    }
  }
  return o;
}

/* ============ 合并：多端同时记录时取并集，不覆盖 ============ */
const RANK = { known:2, fuzzy:1 };
function mergeLearn(a, b){
  if(!a) return b; if(!b) return a;
  // 认了就不会退回去：known 优先；同级保留更早的学会日期
  const ra = RANK[a.status] || 0, rb = RANK[b.status] || 0;
  if(rb > ra) return b;
  if(ra > rb) return a;
  return (String(a.date||'') <= String(b.date||'')) ? a : b;
}
function mergeDay(a, b){
  if(!a) return b; if(!b) return a;
  const uniq = arr => (arr || []).filter((x, i, s) => x && s.indexOf(x) === i);
  // history 取并集：当天露过面的字一个都不能少，用于记录和防止重复抽到
  const history = uniq((a.history || []).concat(b.history || []));
  // chars 是当前待学的卡片，**取更晚操作过的那一方**，不能取并集——
  // 否则两台设备各 5 张卡一合并就变成 10 张，永远学不完
  const atA = String(a.at || ''), atB = String(b.at || '');
  let win = a;
  if(atB > atA) win = b;
  // 有一方已经进入学习阶段就跟着它：锁定比筛选更「新」
  else if(a.phase === 'sift' && b.phase === 'learn') win = b;
  const at = (atB > atA ? atB : atA) || a.at || b.at;
  return { teacher: win.teacher || a.teacher || b.teacher || '',
           phase: win.phase === 'learn' ? 'learn' : 'sift',
           pool: uniq((win.pool || []).concat([])),
           sifted: uniq((a.sifted || []).concat(b.sifted || [])),   // 各选各的，取并集
           picked: (win.picked || []).slice(),
           history,
           at };
}
/* 把 incoming 并进 base，返回 {db, changed} */
function mergeDB(base, incoming){
  const b = normalize(base), i = normalize(incoming);
  const out = normalize(base);
  let changed = 0;

  for(const k of Object.keys(i.days)){
    const m = mergeDay(b.days[k], i.days[k]);
    if(JSON.stringify(m) !== JSON.stringify(b.days[k] || null)) changed++;
    out.days[k] = m;
  }
  for(const c of Object.keys(i.learned)){
    const m = mergeLearn(b.learned[c], i.learned[c]);
    if(JSON.stringify(m) !== JSON.stringify(b.learned[c] || null)) changed++;
    out.learned[c] = m;
  }
  // 抽查：同一台设备同一天取最大值（防止重复上传把次数翻倍），不同设备相加
  for(const day of Object.keys(i.quiz)){
    const pa = b.quiz[day] || {}, pb = i.quiz[day] || {}, m = {};
    for(const dev of new Set(Object.keys(pa).concat(Object.keys(pb)))){
      const va = pa[dev] || [0,0], vb = pb[dev] || [0,0];
      m[dev] = [Math.max(+va[0]||0, +vb[0]||0), Math.max(+va[1]||0, +vb[1]||0)];
    }
    if(JSON.stringify(m) !== JSON.stringify(pa)) changed++;
    out.quiz[day] = m;
  }
  // 标量取「更晚更新」的一方
  if(i.updatedAt && String(i.updatedAt) > String(b.updatedAt || '')){
    if(i.child && i.child !== b.child){ out.child = i.child; changed++; }
    if(i.perDay && i.perDay !== b.perDay){ out.perDay = i.perDay; changed++; }
  }
  // 大人名单取并集
  const tn = (b.teachers || []).concat(i.teachers || []).filter((x, idx, s) => x && s.indexOf(x) === idx);
  if(tn.length !== (out.teachers || []).length){ out.teachers = tn; changed++; }
  out.createdAt = [b.createdAt, i.createdAt].filter(Boolean).sort()[0] || out.createdAt;
  out.rev = Math.max(b.rev || 0, i.rev || 0);
  return { db: out, changed };
}

/* ============ 云同步 ============ */
function setSync(kind, txt){
  const dot = $('#dot');
  dot.className = 'dot' + (kind==='on'?' on':kind==='busy'?' busy':' off');
  $('#synctxt').textContent = txt;
}
function lsKey(){ return binId ? LS_DATA + binId : null; }
function persistLocal(){
  const k = lsKey(); if(!k || !DB) return;
  try{ localStorage.setItem(k, JSON.stringify(DB)); }catch(e){}
}
async function loadCloud(){
  const r = await fetch(API_BASE + '/data/' + encodeURIComponent(binId), { cache:'no-store' });
  if(r.status === 404) return null;
  if(!r.ok) throw new Error('读取失败 ' + r.status);
  return r.json();
}
/* 保存前先取云端最新，合并后再写回。
   这样两台设备交替操作也不会互相抹掉对方，离线期间的记录也补得回来 */
async function saveCloud(opt){
  opt = opt || {};
  if(!binId || !DB) return;
  if(syncing){ pending = true; return; }
  syncing = true; setSync('busy','同步中…');
  try{
    let remote = null;
    try{ remote = await loadCloud(); }
    catch(e){ remote = null; throw e; }

    if(remote && remote !== null){
      const m = mergeDB(remote, DB);        // 云端为底，并入本地改动
      if(m.changed > 0){
        DB = m.db;
        persistLocal();
        if(!opt.silent) renderAll();
      }
      DB.rev = Math.max(remote.rev || 0, DB.rev || 0) + 1;
    }else{
      DB.rev = (DB.rev || 0) + 1;
    }
    DB.updatedAt = new Date().toISOString();
    DB.device = DEVICE_ID;

    snapshotPush();                          // 写回前留一份快照
    const r = await fetch(API_BASE + '/data/' + encodeURIComponent(binId), {
      method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify(DB)
    });
    if(!r.ok) throw new Error('保存失败');
    persistLocal();
    setSync('on','已同步 · ' + new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'}));
  }catch(e){
    persistLocal();
    setSync('off','离线 · 已存本地，联网后自动补回');
  }finally{
    syncing = false;
    if(pending){ pending = false; saveCloud(); }
  }
}
function scheduleSave(){
  persistLocal();
  clearTimeout(timer);
  timer = setTimeout(saveCloud, 700);
}
/* 页面切后台/关闭前把待写入的改动立刻落盘，别等 700ms 防抖 */
function flushSave(){
  if(timer){ clearTimeout(timer); timer = null; }
  if(DB && !syncing) saveCloud({silent:true});
}

/* ============ 本地快照：写回云端前留一份，误删/异常时可回滚 ============ */
function snapKey(){ return binId ? LS_SNAP + binId : null; }
function snapList(){
  const k = snapKey(); if(!k) return [];
  try{
    const arr = JSON.parse(localStorage.getItem(k) || '[]');
    return Array.isArray(arr) ? arr : [];
  }catch(e){ return []; }
}
function snapshotPush(){
  const k = snapKey(); if(!k || !DB) return;
  try{
    const arr = snapList();
    const now = Date.now();
    const last = arr[0];
    const n = Object.keys(DB.learned || {}).length;
    // 字数变了就留档（回滚才有意义）；没变的话 5 分钟留一次，避免刷屏
    if(last && last.learned === n && now - last.t < 300000) return;
    arr.unshift({ t:now, learned:n, rev:DB.rev||0, db:JSON.stringify(DB) });
    while(arr.length > SNAP_MAX) arr.pop();
    localStorage.setItem(k, JSON.stringify(arr));
  }catch(e){
    // 配额不够就只留最近一份
    try{
      localStorage.setItem(k, JSON.stringify([{ t:Date.now(), learned:Object.keys(DB.learned||{}).length,
        rev:DB.rev||0, db:JSON.stringify(DB) }]));
    }catch(e2){}
  }
}
function snapshotRestore(i){
  const arr = snapList();
  const s = arr[i]; if(!s) return false;
  try{
    DB = normalize(JSON.parse(s.db));
    persistLocal(); scheduleSave(); renderAll();
    return true;
  }catch(e){ return false; }
}

/* ============ 字库 ============ */
async function loadChars(){
  const r = await fetch('./data/chars.json?v=1');
  const j = await r.json();
  GRADES = j.grades;
  const seen = new Set();
  GRADES.forEach((g, gi) => {
    g.chars.forEach(arr => {
      const c = arr[0];
      if(seen.has(c)) return;
      seen.add(c);
      const it = { c, p:arr[1]||'', w:arr[2]||[], g:g.name, gi };
      POOL.push(it); MAP[c] = it;
    });
  });
}

/* ============ 今日 ============ */
function learnedCount(){ return Object.keys(DB.learned).length; }
function isKnown(c){ const e = DB.learned[c]; return !!e && e.status === 'known'; }
/* 今天学会几个 = 今天定下的字里已经掌握的。
   筛选时「本来就认识」的字不算今天学的，所以不计入这里。 */
function todayDone(){
  const d = DB.days[todayKey()];
  if(!d) return 0;
  if(d.phase === 'learn') return d.picked.filter(isKnown).length;
  return d.sifted.length;      // 筛选阶段显示已挑出几个
}
/* 当天筛掉的字：本来就认识、没算进今天要学的 */
function todaySiftedOut(){
  const d = DB.days[todayKey()];
  if(!d) return [];
  return d.history.filter(c => !d.picked.includes(c) && !d.sifted.includes(c));
}
function pickNew(n){
  const out = [];
  for(const it of POOL){
    if(out.length >= n) break;
    if(DB.learned[it.c]) continue;
    const t = DB.days[todayKey()];
    if(t){
      const seen = (t.history || []).concat(t.pool || [], t.sifted || [], t.picked || []);
      if(seen.includes(it.c)) continue;   // 今天露过面的字不再重复抽
    }
    out.push(it.c);
  }
  return out;
}
function ensureToday(){
  const k = todayKey();
  let d = DB.days[k];
  if(!d){
    const pool = pickNew(DB.perDay);
    d = blankDay();
    d.teacher = DB.teachers[0] || '';
    d.pool = pool.slice();
    d.history = pool.slice();
    DB.days[k] = d;
    scheduleSave();
    return d;
  }

  /* 自愈：
     筛选阶段 —— 卡片上只能是「还没认识的字」，认识的自动换出补新；
     学习阶段 —— picked 是今天定好的字，即使后来学会了也绝不更换。 */
  if(d.phase !== 'learn'){
    let touched = false;
    // 尚未进入学习阶段，但已经攒够不认识的字 → 锁定
    if(d.sifted.length >= DB.perDay){
      d.picked = d.sifted.slice(0, DB.perDay);
      d.pool = [];
      d.phase = 'learn';
      touched = true;
    }else{
      const stale = d.pool.filter(c => isKnown(c));
      if(stale.length){
        d.pool = d.pool.filter(c => !isKnown(c));
        touched = true;
      }
      if(d.pool.length < DB.perDay){
        const fresh = pickNew(DB.perDay - d.pool.length);
        fresh.forEach(c => {
          d.pool.push(c);
          if(!d.history.includes(c)) d.history.push(c);
        });
        touched = true;
      }
      // 保险：sifted 里混入已认识的（异常数据）直接剔除
      const badSift = d.sifted.filter(c => isKnown(c));
      if(badSift.length){
        d.sifted = d.sifted.filter(c => !isKnown(c));
        touched = true;
      }
    }
    if(touched){ d.at = new Date().toISOString(); scheduleSave(); }
  }
  return d;
}
/* ============ 阶段一：筛选 ============ */
/* 本来就认识 → 盖「认」章翻走，补一个新字上来。
   这个字不算「今天学的」，但计入已掌握。 */
function siftKnown(c){
  const d = DB.days[todayKey()];
  if(!d) return;
  const i = d.pool.indexOf(c);
  DB.learned[c] = { status:'known', date:todayKey(), teacher:d.teacher||'', via:'sift' };
  speak(c);
  if(i < 0){ scheduleSave(); renderAll(); return; }
  const fresh = pickNew(1)[0];
  if(fresh){ d.pool[i] = fresh; if(!d.history.includes(fresh)) d.history.push(fresh); }
  else d.pool.splice(i, 1);
  d.at = new Date().toISOString();
  swapTile(i, fresh, '认', x => '本来就认识，换「' + x + '」问问', '本来就认识');
}
/* 不认识 → 留下来，作为今天要学的字 */
function siftPick(c){
  const d = DB.days[todayKey()];
  if(!d) return;
  if(d.sifted.includes(c)) return;
  d.sifted.push(c);
  d.at = new Date().toISOString();
  speak(c);
  const i = d.pool.indexOf(c);
  const done = d.sifted.length >= DB.perDay;
  if(done){
    // 集齐了 → 锁定今天要学的字
    d.picked = d.sifted.slice(0, DB.perDay);
    d.pool = [];
    d.phase = 'learn';
    scheduleSave();
    stampThen(i, c, '学', () => {
      renderAll();
      toast('集齐 ' + d.picked.length + ' 个字，今天就学它们！');
      celebrate();
    });
  }else{
    scheduleSave();
    stampThen(i, c, '学', () => {
      refreshCard(i);
      $('#d-prog').textContent = '已选 ' + d.sifted.length + ' / ' + DB.perDay + ' 个不认识的字';
      renderTabs();
      toast('记住了，还差 ' + (DB.perDay - d.sifted.length) + ' 个');
    });
  }
}
/* 取消选择 */
function siftUndo(c){
  const d = DB.days[todayKey()];
  if(!d) return;
  d.sifted = d.sifted.filter(x => x !== c);
  d.at = new Date().toISOString();
  scheduleSave(); refreshCard(d.pool.indexOf(c)); renderTabs();
  $('#d-prog').textContent = '已选 ' + d.sifted.length + ' / ' + DB.perDay + ' 个字';
}
/* ============ 阶段二：学习 ============ */
function learnDone(c, ok){
  const d = DB.days[todayKey()];
  if(!d) return;
  const prev = DB.learned[c];
  DB.learned[c] = { status: ok ? 'known' : 'fuzzy', date: todayKey(),
                    teacher: d.teacher || '', via: 'learn' };
  if(!ok && prev && prev.via === 'learn') DB.learned[c].try = (prev.try||0) + 1;
  speak(c);
  scheduleSave();
  const i = d.picked.indexOf(c);
  stampThen(i, c, ok ? '会' : '练', () => {
    renderToday(); renderTabs(); renderLib(); renderLog(); renderStats();
    const left = d.picked.filter(x => !(DB.learned[x] && DB.learned[x].status === 'known')).length;
    if(!left) toast('今天 5 个字都学会了！');
  });
}
/* 学习阶段反悔：重新筛选 */
function reopenSift(){
  const d = DB.days[todayKey()];
  if(!d) return;
  d.phase = 'sift';
  d.pool = d.picked.slice();
  d.sifted = [];
  d.picked = [];
  d.at = new Date().toISOString();
  scheduleSave(); renderAll();
  toast('重新挑一遍今天要学的字');
}
/* 筛选阶段：全部换一批新字问 */
function rerollSift(){
  const d = DB.days[todayKey()];
  if(!d || d.phase === 'learn') return;
  // 已选中的保留，其余换新
  const keep = d.sifted.slice();
  d.pool = keep.concat(pickNew(DB.perDay - keep.length));
  d.pool.forEach(c => { if(!d.history.includes(c)) d.history.push(c); });
  d.at = new Date().toISOString();
  scheduleSave(); renderAll();
  toast('换了一批新字');
}

/* ============ 渲染 ============ */
function renderAll(){
  renderToday(); renderQuizPane(); renderLib(); renderLog(); renderStats(); renderTabs();
  try{ document.title = DB.child + '的认字簿 · ' + learnedCount() + ' 字'; }catch(e){}
}
function renderTabs(){
  const d = DB.days[todayKey()];
  $('#n-today').textContent = (d && d.phase === 'learn' ? todayDone() : todayDone()) + '/' + DB.perDay;
  $('#n-quiz').textContent = quizTotals(DB.quiz).total;
  $('#n-lib').textContent = learnedCount();
  $('#n-log').textContent = Object.keys(DB.days).length;
  $('#n-stat').textContent = Math.round(learnedCount() / POOL.length * 100) + '%';
}
function renderToday(){
  const now = new Date();
  $('#d-date').innerHTML = (now.getMonth()+1) + '月' + now.getDate() + '日'
    + ' <small>星期' + weekday(now) + '</small>';
  const d = ensureToday();
  const sift = d.phase !== 'learn';

  // 大人
  $('#teachers').innerHTML = DB.teachers.map(t =>
    '<button class="chip" data-t="' + esc(t) + '" aria-pressed="' + (d.teacher===t) + '">' + esc(t) + '</button>'
  ).join('') + '<button class="chip ghost" id="t-add">+</button>';

  // 阶段提示
  const list = sift ? d.pool : d.picked;
  const got = d.picked.filter(c => isKnown(c)).length;
  $('#t-phase').className = 'phase ' + (sift ? 'sift' : 'learn');
  $('#t-phase').innerHTML = sift
    ? '<b>第一步 · 挑出不认识的</b><span>问以宁认不认识，认识的换一个，凑够 '
      + DB.perDay + ' 个不认识的就开始学</span>'
    : '<b>今天学这 ' + d.picked.length + ' 个字</b><span>已经定好了，今天就教它们 · 学会 '
      + got + '/' + d.picked.length + '</span>';
  $('#t-phase').hidden = false;

  // 卡片
  $('#tiles').innerHTML = list.map(c => tileNode(c, sift)).join('');
  $('#t-empty').style.display = list.length ? 'none' : 'block';
  $('#d-prog').textContent = sift
    ? '已选 ' + d.sifted.length + ' / ' + DB.perDay + ' 个不认识的字'
    : '学会 ' + got + ' / ' + d.picked.length;
  // 阶段按钮：筛选阶段是「换一批」，学习阶段是「重新挑」
  const rb = $('#t-reopen');
  rb.hidden = false;
  rb.textContent = sift ? '换一批' : '重新挑';
  rb.dataset.phase = sift ? 'sift' : 'learn';
}
/* tileClass / tileInner 需要知道当前阶段，才能渲染正确的按钮 */
function tileClass(c, sift){
  const d = DB.days[todayKey()] || {};
  let cls = 'tile';
  if(sift && d.sifted && d.sifted.includes(c)) cls += ' picked';
  if(!sift && isKnown(c)) cls += ' done';
  return cls;
}
function tileNode(c, sift){ return '<div class="' + tileClass(c, sift) + '">' + tileInner(c, sift) + '</div>'; }
function tileInner(c, sift){
  const it = MAP[c] || {c, p:'', w:[]};
  const d = DB.days[todayKey()] || {};
  const picked = !!(d.sifted && d.sifted.includes(c));
  const known  = isKnown(c);
  let stamp = '';
  if(sift && picked) stamp = '<span class="stamp s2">学</span>';
  if(!sift && known) stamp = '<span class="stamp">会</span>';

  let acts;
  if(sift){
    acts = picked
      ? '<button class="undo" data-act="undo" data-c="' + c + '">取消</button>'
      : '<button class="ok" data-act="know" data-c="' + c + '">认识</button>'
        + '<button class="no" data-act="pick" data-c="' + c + '">不认识</button>';
  }else{
    acts = known
      ? '<button class="undo" data-act="redo" data-c="' + c + '">还没会</button>'
      : '<button class="ok" data-act="got" data-c="' + c + '">学会了</button>'
        + '<button class="no" data-act="miss" data-c="' + c + '">没记住</button>';
  }
  return '<div class="py">' + esc(it.p) + '</div>'
    + '<div class="tzwrap"><div class="tz lg" data-c="' + c + '"><span class="hz">' + c + '</span>'
    + stamp + '</div></div>'
    + '<div class="w">' + (it.w.length ? it.w.map(w=>'<span>'+esc(w)+'</span>').join('') : '<span style="opacity:.45">—</span>') + '</div>'
    + '<div class="acts">' + acts + '</div>';
}
/* 只刷新一张卡：旧卡盖印章后翻走 → 原地浮现新卡，其余卡片纹丝不动 */
function swapTile(i, newC, stampText, msgFn){
  const el = (i >= 0 && $('#tiles').children[i]) ? $('#tiles').children[i] : null;
  scheduleSave();
  if(!el || !newC){ renderAll(); if(msgFn && !newC) toast('字库里没有新字了'); return; }
  addStamp(el, stampText);
  el.classList.add('swap-out');
  const finish = () => {
    el.className = tileClass(newC, true);
    el.innerHTML  = tileInner(newC, true);
    el.classList.add('swap-in');
    setTimeout(() => el.classList.remove('swap-in'), 380);
    renderToday();   // 只更新今日页的进度条与提示，卡片本身上面已换好
    renderTabs(); renderLib(); renderLog(); renderStats();
  };
  reduceMotion() ? finish() : setTimeout(finish, 240);
  if(msgFn) toast(msgFn(newC));
}
/* 盖章 → 卡片原地保留（不翻走） */
function stampThen(i, c, text, cb){
  const el = (i >= 0 && $('#tiles').children[i]) ? $('#tiles').children[i] : null;
  reduceMotion() ? cb() : setTimeout(cb, 260);
  if(el) addStamp(el, text);
}
function refreshCard(i){
  const sift = (DB.days[todayKey()] || {}).phase !== 'learn';
  const el = (i >= 0 && $('#tiles').children[i]) ? $('#tiles').children[i] : null;
  if(!el) return;
  const c = el.querySelector('.hz').textContent;
  el.className = tileClass(c, sift);
  el.innerHTML  = tileInner(c, sift);
}
function addStamp(el, text){
  if(!text) return;
  const wrap = el && el.querySelector('.tzwrap');
  if(wrap && !wrap.querySelector('.stamp')){
    const s = document.createElement('span');
    s.className = 'stamp'; s.textContent = text;
    wrap.appendChild(s);
  }
}
function reduceMotion(){
  return !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion:reduce)').matches);
}
function celebrate(){
  const box = $('#tiles');
  if(!box) return;
  box.classList.remove('cheer'); void box.offsetWidth; box.classList.add('cheer');
  setTimeout(() => box.classList.remove('cheer'), 900);
}
function renderQuizPane(){
  const scopes = [['learned','学过的'],['fuzzy','需巩固'],['known','已掌握'],['all','全部字库']];
  $('#q-scope').innerHTML = scopes.map(s =>
    '<button class="chip" data-q="' + s[0] + '" aria-pressed="' + (qScope===s[0]) + '">' + s[1] + '</button>').join('');
  const qt = quizTotals(DB.quiz);
  $('#q-right').textContent = qt.right;
  $('#q-rate').textContent = qt.total ? Math.round(qt.right / qt.total * 100) + '%' : '—';
  $('#q-cur').textContent = quiz.total;
  if(!quiz.cur){ nextQuiz(); return; }
  renderQuizCard();
}
function quizPool(){
  let list;
  if(qScope === 'all') list = POOL.map(i => i.c);
  else if(qScope === 'fuzzy') list = Object.keys(DB.learned).filter(c => DB.learned[c].status === 'fuzzy');
  else if(qScope === 'known') list = Object.keys(DB.learned).filter(c => DB.learned[c].status === 'known');
  else list = Object.keys(DB.learned);
  // 需巩固的加权出现
  const w = [];
  list.forEach(c => { const n = (DB.learned[c] && DB.learned[c].status === 'fuzzy') ? 3 : 1; for(let i=0;i<n;i++) w.push(c); });
  return w.length ? w : list;
}
function nextQuiz(){
  const pool = quizPool();
  if(!pool.length){
    quiz.cur = null;
    $('#q-body').innerHTML = '<div class="empty">这个范围里还没有字。先去「今日」学几个吧。</div>';
    $('#q-scope-txt').textContent = '';
    return;
  }
  let c = pool[Math.floor(Math.random()*pool.length)];
  if(pool.length > 1){ let guard = 0; while(c === quiz.cur && guard++ < 12) c = pool[Math.floor(Math.random()*pool.length)]; }
  quiz.cur = c; quiz.revealed = false;
  renderQuizCard();
}
function renderQuizCard(){
  const c = quiz.cur; if(!c) return;
  const it = MAP[c] || {c, p:'', w:[]};
  const shown = quiz.revealed;
  $('#q-body').innerHTML =
    '<div class="qwrap"><div class="tz lg" style="cursor:pointer" id="q-tz"><span class="hz">' + c + '</span></div></div>'
    + '<div class="meta">'
    + (shown ? '<div class="py">' + esc(it.p) + '</div><div class="ws">' + (it.w.length?it.w.map(w=>'<span>'+esc(w)+'</span>').join(''):'') + '</div>'
             : '<div class="ws" style="color:var(--muted);font-size:13px">这个字读什么？</div>')
    + '</div>'
    + '<div class="qbtns">'
    + (shown
        ? '<button class="yes" data-qa="next">下一个 →</button>'
        : '<button class="yes" data-qa="right">会读</button><button class="no" data-qa="wrong">不会</button>')
    + '</div>'
    + '<div class="row" style="justify-content:center;margin-top:14px">'
    + '<button class="btn ghost sm" data-qa="say">听发音</button>'
    + '<button class="btn ghost sm" data-qa="detail">看详情</button>'
    + '</div>';
  $('#q-scope-txt').textContent = (it.g || '') + ' · 共 ' + quizPool().length + ' 字';
}
function answer(ok){
  if(quiz.revealed) return;
  quiz.revealed = true; quiz.total++;
  bumpQuiz(!!ok);
  if(ok){
    quiz.right++;
    const e = DB.learned[quiz.cur];
    if(e && e.status === 'fuzzy'){ e.hit = (e.hit||0)+1; if(e.hit >= 2) e.status = 'known'; }
  }else{
    const e = DB.learned[quiz.cur];
    if(e){ e.status = 'fuzzy'; e.hit = 0; }
    else DB.learned[quiz.cur] = { status:'fuzzy', date:todayKey(), teacher:'', hit:0 };
  }
  scheduleSave();
  renderQuizCard(); renderQuizPane(); renderTabs(); renderLib(); renderStats();
}
function renderLib(){
  const st = libFilter.status, gd = libFilter.grade;
  const stats = { k:0, f:0, n:0 };
  const rows = POOL.filter(it => {
    if(gd !== 'all' && it.gi !== +gd) return false;
    const e = DB.learned[it.c];
    const s = !e ? 'n' : (e.status === 'known' ? 'k' : 'f');
    stats[s]++;
    if(st === 'all') return true;
    return st === s;
  });
  $('#lib-sum').textContent = '已掌握 ' + Object.values(DB.learned).filter(e=>e.status==='known').length
    + ' · 需巩固 ' + Object.values(DB.learned).filter(e=>e.status==='fuzzy').length
    + ' · 剩余 ' + (POOL.length - learnedCount());
  $('#lib-status').innerHTML = [['all','全部'],['k','已掌握'],['f','需巩固'],['n','还没学']].map(s =>
    '<button class="chip" data-ls="' + s[0] + '" aria-pressed="' + (st===s[0]) + '">' + s[1] + '</button>').join('');
  $('#lib-grade').innerHTML = [['all','全部']].concat(GRADES.map((g,i)=>[String(i), g.name])).map(g =>
    '<button class="chip" data-lg="' + g[0] + '" aria-pressed="' + (gd===String(g[0])) + '">' + g[1] + '</button>').join('');
  $('#lib-grid').innerHTML = rows.length
    ? rows.slice(0, 400).map(it => {
        const e = DB.learned[it.c];
        const s = !e ? 'n' : (e.status === 'known' ? 'k' : 'f');
        return '<button class="cell ' + s + '" data-c="' + it.c + '">' + it.c + '</button>';
      }).join('')
    : '<div class="empty" style="grid-column:1/-1">这个筛选下还没有字</div>';
  if(rows.length > 400){
    $('#lib-grid').insertAdjacentHTML('beforeend',
      '<div class="empty" style="grid-column:1/-1">… 还有 ' + (rows.length-400) + ' 个字，用上面的筛选缩小范围</div>');
  }
}
function renderLog(){
  const keys = Object.keys(DB.days).sort().reverse();
  $('#l-empty').style.display = keys.length ? 'none' : 'block';
  $('#log-list').innerHTML = keys.map(k => {

    const mark = arr => arr.map(c => {
      const e = DB.learned[c];
      return '<b class="' + (e && e.status==='known' ? 'k' : 'f') + '" data-c="' + c + '">' + c + '</b>';
    }).join('');

      + '<div class="row" style="justify-content:space-between">'

      + '<div class="et">' + (d.teacher ? esc(d.teacher) + '教 · ' : '')

      + '<button class="btn ghost sm" data-del="' + k + '">删除</button></div>'

}
function renderStats(){

/* ============ 发音 ============ */
function speak(text){
  if(!('speechSynthesis' in window)){ toast('这个浏览器不支持朗读'); return; }
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'zh-CN'; u.rate = .8; u.pitch = 1.05;
    speechSynthesis.speak(u);
  }catch(e){}
}

/* ============ 工具 ============ */
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function download(blob, name){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
function renderSnapRow(){
  const box = $('#s-snaps'); if(!box) return;
  const arr = snapList();
  if(!arr.length){ box.innerHTML = '<span class="hint">暂无（同步后自动生成）</span>'; return; }
  box.innerHTML = arr.map((s, i) => {
    const d = new Date(s.t);
    const hm = String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
    return '<button class="btn ghost sm" data-snap="' + i + '">'
      + (d.getMonth()+1) + '/' + d.getDate() + ' ' + hm + ' · ' + (s.learned||0) + '字</button>';
  }).join('');
  box.onclick = e => {
    const b = e.target.closest('button[data-snap]'); if(!b) return;
    const i = +b.dataset.snap;
    if(!confirm('回到这个版本？当前进度会先存成一份新快照。')) return;
    snapshotPush();
    if(snapshotRestore(i + 1)){ toast('已回滚'); renderSnapRow(); }
    else toast('回滚失败');
  };
}
let tToast = null;
function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(tToast); tToast = setTimeout(() => t.classList.remove('on'), 2200);
}

/* ============ 事件 ============ */
function bind(){
  document.querySelectorAll('.tab').forEach(b => b.onclick = () => {
    document.querySelectorAll('.tab').forEach(x => x.setAttribute('aria-selected', String(x === b)));
    ['today','quiz','lib','log','stat'].forEach(p => { $('#p-'+p).hidden = (p !== b.dataset.tab); });
    window.scrollTo({ top:0, behavior:'smooth' });
  });

  $('#tiles').onclick = e => {
    const tz = e.target.closest('.tz'); if(tz){ openDetail(tz.dataset.c); return; }
    const b = e.target.closest('button[data-act]'); if(!b) return;
    const c = b.dataset.c, a = b.dataset.act;
    if(a === 'know') siftKnown(c);          // 阶段一：本来就认识 → 换一个
    else if(a === 'pick') siftPick(c);      // 阶段一：不认识 → 留下来
    else if(a === 'undo') siftUndo(c);      // 阶段一：取消选择
    else if(a === 'got') learnDone(c, true);   // 阶段二：学会了
    else if(a === 'miss') learnDone(c, false); // 阶段二：没记住
    else if(a === 'redo'){                 // 阶段二：反悔，退回没学会
      delete DB.learned[c]; scheduleSave();
      refreshCard(DB.days[todayKey()].picked.indexOf(c));
      renderTabs(); renderLib(); renderStats();
    }
  };

  $('#teachers').onclick = e => {
    const b = e.target.closest('button'); if(!b) return;
    if(b.id === 't-add'){
      const n = prompt('添加一位大人','');
      if(n && n.trim()){
        const v = n.trim();
        if(!DB.teachers.includes(v)) DB.teachers.push(v);
        DB.days[todayKey()].teacher = v;
        scheduleSave(); renderAll();
      }
      return;
    }
    const d = DB.days[todayKey()];
    d.teacher = b.dataset.t;
    // 同步更新今天相关字的教师记录
    (d.picked.length ? d.picked : d.sifted.concat(d.pool)).forEach(c => {
      if(DB.learned[c]) DB.learned[c].teacher = b.dataset.t;
    });
    d.at = new Date().toISOString();
    scheduleSave(); renderAll();
  };
  $('#t-reopen').onclick = () => {
    if($('#t-reopen').dataset.phase === 'sift'){
      if(confirm('换一批新字问问？已经选中的会保留。')) rerollSift();
    }else{
      if(confirm('重新挑今天要学的字？已经学会的会保留。')) reopenSift();
    }
  };

  $('#q-scope').onclick = e => {
    const b = e.target.closest('button'); if(!b) return;
    qScope = b.dataset.q; quiz = { list:[], i:0, right:0, total:0, revealed:false, cur:null };
    renderQuizPane();
  };
  $('#q-body').onclick = e => {
    const tz = e.target.closest('#q-tz');
    if(tz && quiz.cur){ speak(quiz.cur); return; }
    const b = e.target.closest('button'); if(!b) return;
    const a = b.dataset.qa;
    if(a === 'right') answer(true);
    else if(a === 'wrong') answer(false);
    else if(a === 'next'){ quiz.total > 0 ? nextQuiz() : null; renderQuizPane(); }
    else if(a === 'say') speak(quiz.cur);
    else if(a === 'detail') openDetail(quiz.cur);
  };

  $('#lib-status').onclick = e => { const b = e.target.closest('button'); if(b){ libFilter.status = b.dataset.ls; renderLib(); } };
  $('#lib-grade').onclick = e => { const b = e.target.closest('button'); if(b){ libFilter.grade = b.dataset.lg; renderLib(); } };
  $('#lib-grid').onclick = e => { const b = e.target.closest('.cell'); if(b) openDetail(b.dataset.c); };

  $('#log-list').onclick = e => {
    const ch = e.target.closest('b[data-c]');
    if(ch){ openDetail(ch.dataset.c); return; }
    const del = e.target.closest('[data-del]');
    if(del){
      const k = del.dataset.del;
      if(!confirm('删除 ' + k + ' 的记录？当天学的字会退回字库。')) return;
      // 只退掉「当天学会」的字；本来就认识的字不属于那天，保留
      const dk = DB.days[k];
      ((dk.picked && dk.picked.length) ? dk.picked : (dk.sifted || [])).forEach(c => {
        if(DB.learned[c] && DB.learned[c].date === k && DB.learned[c].via !== 'sift') delete DB.learned[c];
      });
      delete DB.days[k];
      scheduleSave(); renderAll(); toast('已删除');
    }
  };

  $('#s-name').onchange = e => { DB.child = e.target.value.trim() || '以宁'; scheduleSave(); renderStats(); toast('已保存'); };
  $('#s-per').onchange = e => { DB.perDay = Math.min(20, Math.max(1, parseInt(e.target.value,10)||5)); scheduleSave(); toast('明天起每天 ' + DB.perDay + ' 个字'); };
  $('#s-add').onclick = () => {
    const v = $('#s-new').value.trim(); if(!v) return;
    if(!DB.teachers.includes(v)) DB.teachers.push(v);
    $('#s-new').value = ''; scheduleSave(); renderStats(); renderToday(); toast('已添加');
  };
  $('#s-teachers').onclick = e => {
    const b = e.target.closest('[data-rt]'); if(!b) return;
    DB.teachers.splice(+b.dataset.rt, 1); scheduleSave(); renderStats(); renderToday();
  };
  $('#s-copy').onclick = () => {
    const url = location.origin + location.pathname + '?id=' + binId;
    const done = () => toast('链接已复制');
    if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(url).then(done, () => prompt('复制这个链接', url));
    else prompt('复制这个链接', url);
  };
  $('#s-export').onclick = () => {
    download(new Blob([JSON.stringify(DB, null, 1)], {type:'application/json'}),
             '认字簿备份-' + DB.child + '-' + todayKey() + '.json');
    toast('备份已下载');
  };
  $('#s-report').onclick = () => {
    download(new Blob([buildReport()], {type:'text/html;charset=utf-8'}),
             '以宁的认字进度-' + todayKey() + '.html');
    toast('报告已下载，双击即可打开');
  };
  $('#s-csv').onclick = () => {
    download(new Blob(['\ufeff' + buildCSV()], {type:'text/csv;charset=utf-8'}),
             '认字明细-' + DB.child + '-' + todayKey() + '.csv');
    toast('明细已下载');
  };
  $('#s-pull').onclick = async () => {
    setSync('busy','拉取中…');
    try{
      const cloud = await loadCloud();
      if(!cloud){ toast('云端还没有数据'); setSync('off','云端为空'); return; }
      const m = mergeDB(DB, cloud);
      DB = m.db; persistLocal(); renderAll();
      toast(m.changed ? '已并入 ' + m.changed + ' 处云端更新' : '已是最新');
      setSync('on','已同步');
    }catch(e){ toast('拉取失败，稍后再试'); setSync('off','离线'); }
  };
  $('#s-push').onclick = async () => {
    setSync('busy','上传中…');
    await saveCloud({silent:true});
    renderAll(); toast('已上传到云端');
  };
  $('#s-import').onclick = () => {
    const i = document.createElement('input'); i.type = 'file'; i.accept = '.json';
    i.onchange = () => {
      const f = i.files[0]; if(!f) return;
      const r = new FileReader();
      r.onload = () => {
        try{
          DB = normalize(JSON.parse(r.result));
          scheduleSave(); renderAll(); toast('导入成功');
        }catch(err){ toast('文件格式不对'); }
      };
      r.readAsText(f);
    };
    i.click();
  };

  $('#mask').onclick = e => { if(e.target.id === 'mask') closeDetail(); };
  document.addEventListener('keydown', e => { if(e.key === 'Escape') closeDetail(); });

  /* 切后台 / 关页面 / 断网恢复：都把待写入的改动补回云端 */
  const flush = () => flushSave();
  document.addEventListener('visibilitychange', () => { if(document.hidden) flush(); });
  window.addEventListener('pagehide', flush);
  window.addEventListener('beforeunload', flush);
  window.addEventListener('online', () => { setSync('busy','重新连接…'); flushSave(); });
  // 每 2 分钟兜底同步一次：多端同时用的时候，这台也能看到别的设备刚教的字
  setInterval(() => { if(!document.hidden && !syncing) syncPull(); }, 120000);
}
/* 只拉不合：定时把云端新内容并进来（本地未上传的不会丢，saveCloud 会带上去） */
async function syncPull(){
  if(!binId || syncing) return;
  try{
    const cloud = await loadCloud();
    if(!cloud) return;
    const m = mergeDB(DB, cloud);
    if(m.changed > 0){
      DB = m.db; persistLocal(); renderAll();
      toast('已同步其他设备的新记录');
    }
  }catch(e){}
}

/* ============ 报告数据 ============ */
function reportData(){
  const ks = Object.keys(DB.learned);
  const known = ks.filter(c => DB.learned[c].status === 'known');
  const fuzzy = ks.filter(c => DB.learned[c].status === 'fuzzy');
  const left  = POOL.length - ks.length;

  let streak = 0;
  const cur = new Date();
  for(let i=0;i<400;i++){
    const k = fmtDate(cur);
    if(DB.days[k]) streak++;
    else if(i > 0) break;
    cur.setDate(cur.getDate()-1);
  }

  // 按日期升序：累计「今天学会的字」曲线 + 明细
  const dayKeys = Object.keys(DB.days).sort();
  const cum = [];
  const acc = new Set();
  dayKeys.forEach(k => {
    const d = DB.days[k];
    const picked = (d.picked && d.picked.length) ? d.picked : (d.sifted || []);
    picked.forEach(c => { if(DB.learned[c]) acc.add(c); });
    cum.push({ k, n: acc.size });
  });
  // 累计被筛掉的字：本来就认识、没有算进当天学的
  let siftedOut = 0;
  Object.keys(DB.days).forEach(k => {
    const d = DB.days[k];
    const picked = (d.picked && d.picked.length) ? d.picked : (d.sifted || []);
    siftedOut += (d.history || []).filter(c => !picked.includes(c)).length;
  });

  const grades = GRADES.map((g, i) => {
    const tot = POOL.filter(x => x.gi === i).length || 1;
    const kn  = known.filter(c => (MAP[c] && MAP[c].gi === i)).length;
    return { name:g.name, tot:POOL.filter(x => x.gi === i).length, known:kn, pct: kn/tot*100 };
  });

  const qt = quizTotals(DB.quiz);
  // 每位大人教了多少字（按 learned 记录的 teacher）
  const byTeacher = {};
  Object.keys(DB.learned).forEach(c => {
    const t = DB.learned[c].teacher || '未记录';
    byTeacher[t] = (byTeacher[t] || 0) + 1;
  });
  return {
    child:DB.child, known:known.slice().sort(), fuzzy:fuzzy.slice().sort(), left,
    learned:ks.length, streak, days:dayKeys.length, cum, grades, siftedOut,
    qt, byTeacher, perDay:DB.perDay, pool:POOL.length
  };
}

/* ============ 学习进度报告（自包含 HTML，可打印成 PDF） ============ */
function buildReport(){
  const R = reportData();
  const now = new Date();
  const genAt = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0') + '-'
    + String(now.getDate()).padStart(2,'0') + ' '
    + String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
  const first = R.cum.length ? R.cum[0].k : '—';

  /* --- 累计掌握曲线（内联 SVG，无外部依赖） --- */
  let curve = '';
  if(R.cum.length >= 1){
    const W = 680, H = 190, PL = 44, PR = 14, PT = 16, PB = 30;
    const maxN = Math.max(1, R.cum[R.cum.length-1].n);
    const x = i => PL + (W-PL-PR) * (R.cum.length===1 ? .5 : i/(R.cum.length-1));
    const y = n => PT + (H-PT-PB) * (1 - n/maxN);
    const pts = R.cum.map((p,i) => x(i).toFixed(1) + ',' + y(p.n).toFixed(1)).join(' ');
    const area = pts + ' ' + x(R.cum.length-1).toFixed(1) + ',' + (H-PB) + ' ' + x(0).toFixed(1) + ',' + (H-PB);
    let grid = '', ticks = '';
    for(let g=0; g<=4; g++){
      const v = Math.round(maxN * g/4), gy = y(v).toFixed(1);
      grid += '<line x1="'+PL+'" y1="'+gy+'" x2="'+(W-PR)+'" y2="'+gy+'" stroke="#E7DFD0" stroke-width="1"'
            + (g===0 ? '' : ' stroke-dasharray="3 4"') + '/>';
      ticks += '<text x="'+(PL-8)+'" y="'+(+gy+4)+'" text-anchor="end" font-size="11" fill="#9A9083">'+v+'</text>';
    }
    let labels = '';
    [0, Math.floor((R.cum.length-1)/2), R.cum.length-1].forEach((i, idx) => {
      if(idx === 1 && R.cum.length < 3) return;
      labels += '<text x="'+x(i).toFixed(1)+'" y="'+(H-9)+'" text-anchor="middle" font-size="11" fill="#9A9083">'
              + R.cum[i].k.slice(5) + '</text>';
    });
    curve = '<svg viewBox="0 0 '+W+' '+H+'" width="100%" height="'+H+'" role="img" aria-label="累计掌握字数曲线">'
      + grid + ticks
      + '<polygon points="'+area+'" fill="#C1443B" opacity=".10"/>'
      + '<polyline points="'+pts+'" fill="none" stroke="#C1443B" stroke-width="2.4" '
      + 'stroke-linejoin="round" stroke-linecap="round"/>'
      + R.cum.map((p,i) => '<circle cx="'+x(i).toFixed(1)+'" cy="'+y(p.n).toFixed(1)+'" r="2.6" fill="#C1443B"/>').join('')
      + labels + '</svg>';
  }else{
    curve = '<p class="muted">还没有足够的数据画出曲线，学满两天后就会出现。</p>';
  }

  /* --- 12 周打卡热力图 --- */
  const todayK = todayKey();
  const end = new Date(todayK + 'T00:00:00');
  end.setDate(end.getDate() + (6 - ((end.getDay()+6)%7)));   // 补到本周日
  const cells = [];
  for(let i=83; i>=0; i--){
    const dt = new Date(end); dt.setDate(dt.getDate()-i);
    const k = fmtDate(dt);
    const d = DB.days[k];
    const picked = d ? ((d.picked && d.picked.length) ? d.picked : (d.sifted || [])) : [];
    const cnt = picked.filter(c => DB.learned[c]).length;
    cells.push({ k, cnt, future: k > todayK, day:dt.getDay() });
  }
  const maxCnt = Math.max(1, ...cells.map(c => c.cnt));
  const lvl = c => c.cnt === 0 ? 0 : (c.cnt >= maxCnt ? 4 : (c.cnt >= maxCnt*.66 ? 3 : (c.cnt >= maxCnt*.33 ? 2 : 1)));
  const HBG = ['#EFEAE0','#F2D9D2','#E9B6AB','#DC8B7C','#C1443B'];
  let heat = '<div class="heat">';
  for(let w=0; w<12; w++){
    heat += '<div class="hcol">';
    for(let dd=0; dd<7; dd++){
      const c = cells[w*7+dd];
      const bg = c.future ? 'transparent' : HBG[lvl(c)];
      const title = c.future ? '' : (c.k + '：' + (c.cnt ? '学会 ' + c.cnt + ' 字' : '休息'));
      heat += '<i style="background:' + bg + '" title="' + title + '"></i>';
    }
    heat += '</div>';
  }
  heat += '</div>';

  /* --- 每日明细 --- */
  const rows = Object.keys(DB.days).sort().reverse().map(k => {
    const d = DB.days[k];
    const dd = new Date(k + 'T00:00:00');
    const picked = (d.picked && d.picked.length) ? d.picked : (d.sifted || []);
    const got = picked.filter(c => DB.learned[c] && DB.learned[c].status === 'known');
    const out = (d.history || []).filter(c => !picked.includes(c));
    const cell = arr => arr.map(c => '<span class="' + (DB.learned[c] && DB.learned[c].status==='known' ? 'k' : 'f') + '">' + c + '</span>').join('');
    return '<tr><td class="nowrap">' + k + '</td>'
      + '<td class="nowrap">' + (dd.getMonth()+1) + '/' + dd.getDate() + ' 周' + weekday(dd) + '</td>'
      + '<td class="nowrap">' + esc(d.teacher || '—') + '</td>'
      + '<td class="nowrap">' + picked.length + '</td>'
      + '<td class="nowrap"><b>' + got.length + '</b></td>'
      + '<td class="hzline">' + (picked.length ? cell(picked) : '<span class="muted">—</span>') + '</td>'
      + '<td class="hzline dim">' + (out.length ? cell(out) : '<span class="muted">—</span>') + '</td></tr>';
  }).join('');

  const chip = arr => arr.length
    ? arr.map(c => '<span class="cc k">' + c + '</span>').join('')
    : '<span class="muted">暂无</span>';

  return '<!DOCTYPE html>\n<html lang="zh-CN"><head><meta charset="utf-8">'
  + '<meta name="viewport" content="width=device-width,initial-scale=1">'
  + '<title>' + esc(R.child) + '的认字进度报告 · ' + genAt.slice(0,10) + '</title>'
  + '<style>' + REPORT_CSS + '</style></head><body><div class="pg">'
  + '<header><div><h1>' + esc(R.child) + '的认字进度报告</h1>'
  + '<p class="sub">统计区间 ' + first + ' 至 ' + todayK + ' · 生成于 ' + genAt + '</p></div>'
  + '<div class="seal">认</div></header>'

  + '<section class="kpis">'
  + kpi(R.known.length, '已掌握', '字') + kpi(R.fuzzy.length, '需巩固', '字')
  + kpi(R.left, '剩余', '字') + kpi(R.streak, '连续打卡', '天')
  + kpi(R.days, '累计打卡', '天')
  + kpi(R.qt.total ? Math.round(R.qt.right/R.qt.total*100) + '%' : '—', '抽查正确率',
        R.qt.total ? '答 ' + R.qt.total + ' 题' : '还没抽查')
  + '</section>'

  + (R.siftedOut ? '<p class="tip">筛选环节还认出了 <b>' + R.siftedOut
      + '</b> 个本来就认识的字，这些不计入「今天学的」。</p>' : '')
  + '<section class="card"><h2>学习曲线</h2>'
  + '<p class="muted">纵轴是累计学会的字数，横轴是日期。</p>' + curve + '</section>'

  + '<section class="card"><h2>打卡日历（最近 12 周）</h2>'
  + heat
  + '<p class="legend"><span>少</span>'
  + HBG.map(b => '<i style="background:' + b + '"></i>').join('')
  + '<span>多</span><em>灰色表示这天还没到 / 休息</em></p></section>'

  + '<section class="card"><h2>分册进度</h2>'
  + R.grades.map(g => '<div class="bar"><div class="l"><span>' + esc(g.name)
      + '</span><span>' + g.known + ' / ' + g.tot + '</span></div>'
      + '<div class="t"><i style="width:' + g.pct.toFixed(1) + '%"></i></div></div>').join('')
  + '<div class="bar total"><div class="l"><span><b>总进度</b></span><span><b>'
      + R.learned + ' / ' + R.pool + '</b></span></div>'
      + '<div class="t"><i style="width:' + (R.learned/R.pool*100).toFixed(1) + '%"></i></div></div>'
  + '</section>'

  + (Object.keys(R.byTeacher).length ? '<section class="card"><h2>谁教得多</h2><div class="tea">'
      + Object.keys(R.byTeacher).sort((a,b)=>R.byTeacher[b]-R.byTeacher[a])
        .map(t => '<div class="ti"><b>' + esc(t) + '</b><span>' + R.byTeacher[t] + ' 字</span>'
        + '<div class="t"><i style="width:' + (R.byTeacher[t]/R.learned*100).toFixed(1) + '%"></i></div></div>').join('')
      + '</div></section>' : '')

  + '<section class="card"><h2>每日明细</h2>'
  + (rows ? '<table><thead><tr><th>日期</th><th>星期</th><th>教的人</th><th>学</th><th>会</th>'
      + '<th>当天学的字</th><th>本来就认识</th></tr></thead><tbody>' + rows + '</tbody></table>'
         : '<p class="muted">还没有记录。</p>')
  + '</section>'

  + '<section class="card"><h2>已掌握（' + R.known.length + ' 字）</h2><div class="chips">' + chip(R.known) + '</div></section>'
  + (R.fuzzy.length ? '<section class="card"><h2>需要巩固（' + R.fuzzy.length + ' 字）</h2><div class="chips">'
      + R.fuzzy.map(c => '<span class="cc f">' + c + '</span>').join('') + '</div></section>' : '')

  + '<footer>由「' + esc(R.child) + '的认字簿」生成 · 数据源自云端同步记录'
  + (R.qt.total ? ' · 累计抽查 ' + R.qt.total + ' 次' : '') + '</footer>'
  + '</div></body></html>';
}
function kpi(v, label, unit){
  return '<div class="kpi"><b>' + v + '</b><span>' + esc(label) + '</span><em>' + esc(unit) + '</em></div>';
}
const REPORT_CSS = [

function buildCSV(){
  // 逐字明细
  const q = s => '"' + String(s==null?'':s).replace(/"/g,'""') + '"';
  const viaOf = v => v === 'sift' ? '本来就认识' : (v === 'learn' ? '当天学会' : (v === 'quiz' ? '抽查' : ''));
  const lines = [['字','拼音','册次','状态','日期','教的人','来源'].join(',')];
  Object.keys(DB.learned).sort().forEach(c => {
    const e = DB.learned[c], it = MAP[c] || {};
    lines.push([q(c), q(it.p||''), q(it.g||''),
      q(e.status === 'known' ? '已掌握' : '需巩固'),
      q(e.date||''), q(e.teacher||''), q(viaOf(e.via))].join(','));
  });
  // 每日记录
  lines.push('');
  lines.push(['日期','教的人','当天学的字','学会几个','本来就认识的字'].join(','));
  Object.keys(DB.days).sort().reverse().forEach(k => {
    const d = DB.days[k];
    const picked = (d.picked && d.picked.length) ? d.picked : (d.sifted || []);
    const out = (d.history || []).filter(c => !picked.includes(c));
    lines.push([q(k), q(d.teacher||''), q(picked.join('')),
      q(picked.filter(c => isKnown(c)).length), q(out.join(''))].join(','));
  });
  return lines.join('\n');
}

/* ============ 启动 ============ */
async function boot(){
  const params = new URLSearchParams(location.search);
  binId = params.get('id') || localStorage.getItem(LS_BIN) || DEFAULT_BIN;
  localStorage.setItem(LS_BIN, binId);

  try{ await loadChars(); }
  catch(e){ document.querySelector('.wrap').innerHTML = '<div class="card"><div class="empty">字库加载失败，请刷新重试。</div></div>'; return; }

  // 先本地（离线也能立刻用），再与云端合并。
  // 注意：云端处理完之前不要 renderAll —— ensureToday 会抢先创建当天的 5 个字，
  // 其 at 比云端新，合并时就会把云端已有的当天进度顶掉（这是此前数据错乱的根源）。
  const cached = localStorage.getItem(LS_DATA + binId);
  DB = normalize(cached ? JSON.parse(cached) : null);

  bind();
  setSync('busy','读取云端…');
  try{
    const cloud = await loadCloud();
    if(cloud){
      // 关键：以云端为底并入本地，而不是拿云端整体覆盖本地。
      // 否则离线期间教的字会被云端旧数据抹掉。
      const m = mergeDB(cloud, DB);
      DB = m.db;
      persistLocal();
      setSync('on','已同步');
      if(m.changed > 0) await saveCloud({silent:true});   // 本地有云端缺的，补回去
    }else{
      await saveCloud({silent:true});   // 首次：用固定 id 建一份
    }
  }catch(e){
    setSync('off','离线 · 已存本地，联网后自动补回');
  }
  renderAll();          // 此时才渲染：ensureToday 创建/自愈当天卡片
  renderSnapRow();

  // 笔顺动画（CDN 可用时才出现按钮）
  const s = document.createElement('script');
  s.src = 'https://cdn.jsdelivr.net/npm/hanzi-writer@3.7.0/dist/hanzi-writer.min.js';
  s.onload = () => { hwReady = true; };
  s.onerror = () => { hwReady = false; };
  document.head.appendChild(s);
}

/* 自动化测试用的观察口（只读，不改变任何行为） */
window.__lit = {
  get db(){ return DB; },
  quizTotal(){ return quizTotals(DB.quiz).total; },
  syncPull, saveCloud, mergeDB, buildReport, buildCSV, snapshotRestore, snapList,
  renderAll, ensureToday, siftKnown, siftPick, siftUndo, learnDone, reopenSift, rerollSift
};
boot();
</script>
